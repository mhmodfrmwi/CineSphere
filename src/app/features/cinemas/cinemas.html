<section class="px-4 md:px-12 py-8 max-w-[1920px] mx-auto">
  <div class="mb-8">
    <h1 class="section-title">Cinemas</h1>
    <p class="section-subtitle">Find a theater near you</p>
  </div>

  @if (loading()) {
    <p class="text-cine-gray-light animate-pulse">Loading cinemas...</p>
  } @else if (cinemas().length > 0) {
    <ul class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (cinema of cinemas(); track cinema.id) {
        <li>
          <a [routerLink]="['/cinemas', cinema.id]" class="card-cine block hover:border-cine-red/40">
            <h2 class="text-lg font-semibold text-white mb-1">{{ cinema.name }}</h2>
            <p class="text-cine-gray-light text-sm">{{ cinema.location }}</p>
          </a>
        </li>
      }
    </ul>
  } @else {
    <p class="text-cine-gray-light text-center py-12">No cinemas available.</p>
  }
</section>
