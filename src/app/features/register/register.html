<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12 relative">
  <div class="absolute inset-0 bg-gradient-to-b from-cine-black-deep via-cine-black/90 to-cine-black pointer-events-none"></div>
  <div
    class="absolute inset-0 opacity-20 pointer-events-none"
    style="background: radial-gradient(ellipse at top, #e50914 0%, transparent 60%)"
  ></div>

  <div class="relative w-full max-w-md card-cine shadow-2xl">
    <div class="mb-8 text-center">
      <h1 class="font-display text-4xl tracking-widest text-cine-red mb-2">CineSphere</h1>
      <h2 class="section-title text-xl mb-1">Create Account</h2>
      <p class="section-subtitle">Join to book your favorite movies</p>
    </div>

    @if (errorMessage) {
      <p class="mb-4 text-sm text-cine-red text-center">{{ errorMessage }}</p>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="firstName" class="block text-sm font-medium text-cine-gray-light mb-1.5">First Name</label>
          <input id="firstName" type="text" formControlName="firstName" class="input-dark" />
        </div>
        <div>
          <label for="lastName" class="block text-sm font-medium text-cine-gray-light mb-1.5">Last Name</label>
          <input id="lastName" type="text" formControlName="lastName" class="input-dark" />
        </div>
      </div>
      <div>
        <label for="username" class="block text-sm font-medium text-cine-gray-light mb-1.5">Username</label>
        <input id="username" type="text" formControlName="username" class="input-dark" />
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-cine-gray-light mb-1.5">Email</label>
        <input id="email" type="email" formControlName="email" class="input-dark" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-cine-gray-light mb-1.5">Password</label>
        <input id="password" type="password" formControlName="password" class="input-dark" />
      </div>
      <button type="submit" class="btn-primary w-full py-3" [disabled]="registerForm.invalid">
        Sign Up
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-cine-gray-light">
      Already have an account?
      <a routerLink="/login" class="text-cine-red hover:underline">Sign in</a>
    </p>
  </div>
</div>
